<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>3面まとめ印刷</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F2F4F2;
  --surface:#FFFFFF;
  --surface-sunken:#E7EAE7;
  --ink:#1D2624;
  --ink-soft:#5B6864;
  --line:#D6DAD6;
  --accent:#2B5D63;
  --accent-strong:#1C4247;
  --accent-soft:#DCEAE9;
  --danger:#B3492F;
  --shadow:0 1px 2px rgba(29,38,36,.08), 0 8px 24px rgba(29,38,36,.07);
}
img{ max-width:100%; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171C1B;
    --surface:#212826;
    --surface-sunken:#1B211F;
    --ink:#ECEFED;
    --ink-soft:#A6B1AD;
    --line:#333C39;
    --accent:#74C4B7;
    --accent-strong:#93D6CB;
    --accent-soft:#25403D;
    --danger:#E39079;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#171C1B;
  --surface:#212826;
  --surface-sunken:#1B211F;
  --ink:#ECEFED;
  --ink-soft:#A6B1AD;
  --line:#333C39;
  --accent:#74C4B7;
  --accent-strong:#93D6CB;
  --accent-soft:#25403D;
  --danger:#E39079;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
}
*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.mono{ font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace; font-variant-numeric:tabular-nums; }
.app-shell{ max-width:480px; margin:0 auto; padding:20px 16px 64px; }
a,button{ font-family:inherit; }

/* ---- header ---- */
.app-header{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
.mark{ flex:none; width:34px; height:34px; }
.mark rect{ stroke:var(--accent); stroke-width:6; }
.app-title{ font-size:1.22rem; font-weight:700; letter-spacing:.01em; text-wrap:balance; margin:0; }
.app-sub{ margin:2px 0 0; font-size:.8rem; color:var(--ink-soft); }

/* ---- step chips ---- */
.steps{ display:flex; gap:8px; margin-bottom:22px; }
.step-chip{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:8px 4px 9px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); cursor:default; color:var(--ink-soft);
}
.step-chip.is-clickable{ cursor:pointer; }
.step-chip .num{
  width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; font-size:.75rem; font-weight:500;
  background:var(--surface-sunken); color:var(--ink-soft);
}
.step-chip .label{ font-size:.68rem; letter-spacing:.02em; }
.step-chip.is-active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong); }
.step-chip.is-active .num{ background:var(--accent); color:var(--surface); }
.step-chip.is-done{ color:var(--ink); }
.step-chip.is-done .num{ background:var(--ink); color:var(--surface); }

/* ---- panel ---- */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); }
.panel + .panel{ margin-top:16px; }
.panel h2{ font-size:1.02rem; font-weight:700; margin:0 0 4px; text-wrap:balance; }
.panel .hint{ margin:0 0 16px; font-size:.83rem; color:var(--ink-soft); line-height:1.6; }
[hidden]{ display:none !important; }

/* ---- upload zone ---- */
.upload-zone{
  border:1.5px dashed var(--line); border-radius:14px; padding:28px 16px;
  display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
  background:var(--surface-sunken); cursor:pointer;
}
.upload-zone svg{ opacity:.55; }
.upload-zone .cta{ font-weight:700; font-size:.95rem; }
.upload-zone .note{ font-size:.78rem; color:var(--ink-soft); }
.upload-zone input{ display:none; }

/* ---- crop stage ---- */
.crop-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
.crop-frame{
  position:relative; border-radius:10px; overflow:hidden; background:#000;
  box-shadow:0 2px 10px rgba(0,0,0,.25); touch-action:none;
}
.crop-frame canvas{ display:block; touch-action:none; }
.crop-frame .ring{ position:absolute; inset:0; border:2px solid rgba(255,255,255,.85); border-radius:10px; pointer-events:none; }
.zoom-row{ display:flex; align-items:center; gap:10px; width:100%; }
.zoom-row input[type=range]{ flex:1; accent-color:var(--accent); }
.icon-btn{
  flex:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:1.05rem; line-height:1; cursor:pointer;
}
.icon-btn:active{ background:var(--surface-sunken); }

/* ---- correction stage ---- */
.correct-grid{ display:flex; gap:18px; flex-wrap:wrap; }
.correct-preview{ flex:none; }
.correct-preview canvas{
  width:130px; height:auto; border-radius:8px; border:1px solid var(--line);
  box-shadow:var(--shadow); background:#fff;
}
.correct-controls{ flex:1; min-width:180px; display:flex; flex-direction:column; gap:14px; }
.field label{ display:flex; justify-content:space-between; font-size:.8rem; color:var(--ink-soft); margin-bottom:4px; }
.field label .val{ font-family:'IBM Plex Mono',monospace; color:var(--ink); }
.field input[type=range]{ width:100%; accent-color:var(--accent); }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; font-size:.85rem; }
.switch{ position:relative; width:40px; height:24px; flex:none; }
.switch input{ opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; }
.switch .track{ position:absolute; inset:0; background:var(--surface-sunken); border:1px solid var(--line); border-radius:999px; transition:background .15s; }
.switch .knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .15s; }
.switch input:checked + .track{ background:var(--accent); border-color:var(--accent); }
.switch input:checked + .track + .knob{ transform:translateX(16px); }

/* ---- buttons ---- */
.btn{
  appearance:none; border:none; border-radius:11px; padding:13px 18px; font-size:.92rem; font-weight:700;
  cursor:pointer; width:100%; text-align:center;
}
.btn-primary{ background:var(--accent); color:#fff; }
.btn-primary:active{ background:var(--accent-strong); }
.btn-ghost{ background:transparent; color:var(--ink-soft); font-weight:500; padding:8px; }
.btn-row{ display:flex; gap:10px; margin-top:18px; }
.btn-row .btn{ width:auto; flex:1; }
.auto-btn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:var(--accent-soft); color:var(--accent-strong); border:1px solid var(--accent);
  border-radius:10px; padding:10px; font-weight:700; font-size:.85rem; cursor:pointer;
}
.auto-btn:active{ background:var(--accent); color:#fff; }

/* ---- layout view ---- */
.sheet-img{
  display:block; width:min(300px, 80vw); aspect-ratio:210/297; margin:0 auto 16px;
  background:#fff; border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow);
}
.save-guide{
  background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px;
  padding:14px 16px; margin:0 0 16px; color:var(--accent-strong);
}
.save-guide h3{ margin:0 0 8px; font-size:.9rem; font-weight:700; }
.save-guide ol{ margin:0; padding-left:1.2em; font-size:.83rem; line-height:1.9; }
.save-guide .strong{ font-weight:700; }
.edit-row{ display:flex; gap:8px; margin:0 0 6px; }
.edit-row button{
  flex:1; padding:9px 4px; font-size:.78rem; border-radius:9px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer;
}
.edit-row button:active{ background:var(--surface-sunken); }
.spec-note{ font-size:.78rem; color:var(--ink-soft); text-align:center; margin:0 0 18px; line-height:1.7; }
.spec-note .mono{ color:var(--ink); }

/* ---- print path (desktop browsers): print the composed sheet image only ---- */
.print-only{ display:none; }
@media print{
  html, body{ margin:0; padding:0; background:#fff; height:auto; }
  .app-shell{ display:none !important; }
  .print-only{ display:block; }
  .print-only img{ width:210mm; height:297mm; display:block; }
  @page{ size:A4; margin:0; }
}
</style>

</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
      <rect x="3" y="3" width="12" height="12" fill="var(--accent)"/>
      <rect x="19" y="3" width="12" height="12" fill="var(--accent)"/>
      <rect x="3" y="19" width="12" height="12" fill="var(--accent)"/>
      <rect x="19" y="19" width="12" height="12" fill="none"/>
    </svg>
    <div>
      <p class="app-title">3面まとめ印刷</p>
      <p class="app-sub">写真3枚をトリミング・濃さ補正して、A4用紙1枚に配置します</p>
    </div>
  </header>

  <nav class="steps" id="steps"></nav>

  <div id="editor"></div>

  <section class="panel" id="layoutPanel" hidden>
    <h2>できあがり(A4 1枚)</h2>
    <p class="hint" id="layoutHint">この画像がそのままA4 1枚になります。</p>
    <img class="sheet-img" id="sheetImg" alt="A4 1枚に3面を配置した仕上がり">
    <div class="save-guide">
      <h3>iPhone / iPad から印刷する</h3>
      <ol>
        <li>上の画像を<span class="strong">長押し</span></li>
        <li>メニューから<span class="strong">「共有…」</span>→<span class="strong">「プリント」</span></li>
        <li>用紙サイズがA4になっているか確認して印刷</li>
      </ol>
    </div>
    <div class="save-guide">
      <h3>パソコンから印刷する</h3>
      <ol>
        <li>上の画像を<span class="strong">右クリック</span>(トラックパッドは2本指クリック)</li>
        <li><span class="strong">「画像を保存」</span>で保存し、保存した画像を開く</li>
        <li>開いたビューアの印刷機能で、用紙サイズ<span class="strong">A4・余白なし</span>で印刷</li>
      </ol>
    </div>
    <div class="edit-row">
      <button type="button" data-edit="0">1枚目を編集</button>
      <button type="button" data-edit="1">2枚目を編集</button>
      <button type="button" data-edit="2">3枚目を編集</button>
    </div>
    <p class="spec-note">1面あたり <span class="mono" id="cellMmNote"></span>・A4全体 <span class="mono" id="outDpiNote"></span></p>
    <button class="btn btn-ghost" id="resetAllBtn">最初からやり直す</button>
  </section>

  <div class="print-only" id="printOnly"><img id="printSheetImg" alt=""></div>
</div>

<script>
(function(){
  "use strict";

  // ---- constants: everything is derived from the A4 sheet, so nothing can drift ----
  var MM_PER_IN = 25.4;
  var OUTPUT_DPI = 200;
  var A4_W_MM = 210, A4_H_MM = 297;
  var MARGIN_MM = 7;   // white border baked into the image (printers can't reach the edge)
  var GUTTER_MM = 4;   // gap between the 4 panels
  var CELL_W_MM = (A4_W_MM - MARGIN_MM * 2 - GUTTER_MM) / 2;  // 96
  var CELL_H_MM = (A4_H_MM - MARGIN_MM * 2 - GUTTER_MM) / 2;  // 139.5
  var FRAME_RATIO = CELL_W_MM / CELL_H_MM; // width / height, shared by the crop frame

  function mm2px(mm){ return Math.round(mm / MM_PER_IN * OUTPUT_DPI); }
  var OUT_W = mm2px(CELL_W_MM), OUT_H = mm2px(CELL_H_MM);
  var SHEET_W = mm2px(A4_W_MM), SHEET_H = mm2px(A4_H_MM);
  var CELL_POS = [
    { x: mm2px(MARGIN_MM), y: mm2px(MARGIN_MM) },
    { x: mm2px(MARGIN_MM + CELL_W_MM + GUTTER_MM), y: mm2px(MARGIN_MM) },
    { x: mm2px(MARGIN_MM), y: mm2px(MARGIN_MM + CELL_H_MM + GUTTER_MM) }
  ];
  var MAX_ZOOM = 4;
  var STEP_LABELS = ["写真1", "写真2", "写真3", "仕上がり"];

  document.getElementById('outDpiNote').textContent = SHEET_W + '×' + SHEET_H + 'px (' + OUTPUT_DPI + 'dpi)';
  document.getElementById('cellMmNote').textContent = CELL_W_MM + '×' + CELL_H_MM + 'mm';

  function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }

  // ---- state ----
  var slots = [0, 1, 2].map(function(i){
    return {
      index: i,
      img: null,
      stage: 'upload', // upload -> crop -> correct
      transform: { scale: 1, panX: 0, panY: 0 },
      rawCropped: null,
      correction: { grayscale: true, levelMin: 0, levelMax: 255, brightness: 0, contrast: 0, binarize: false, threshold: 150 },
      finalCanvas: null,
      confirmed: false,
      pointers: new Map(),
      pinchStartDist: null,
      pinchStartScale: null,
      cssW: 0, cssH: 0, baseScale: 1,
      el: {}
    };
  });
  var view = 'edit';          // 'edit' | 'layout'
  var currentSlot = 0;

  // ============ build step chips ============
  var stepsEl = document.getElementById('steps');
  var chipEls = [];
  STEP_LABELS.forEach(function(label, i){
    var chip = document.createElement('div');
    chip.className = 'step-chip';
    chip.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="label">' + label + '</span>';
    chip.addEventListener('click', function(){
      if (i < 3) {
        if (!slots[i].img) return;
        view = 'edit'; currentSlot = i; render();
      } else {
        if (!slots.some(function(s){ return s.confirmed; })) return;
        view = 'layout'; render();
      }
    });
    stepsEl.appendChild(chip);
    chipEls.push(chip);
  });

  // ============ build one slot editor panel ============
  var editorEl = document.getElementById('editor');

  function buildSlotPanel(slot){
    var panel = document.createElement('section');
    panel.className = 'panel';

    // -- upload block --
    var uploadZone = document.createElement('label');
    uploadZone.className = 'upload-zone';
    uploadZone.innerHTML =
      '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' +
      '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-4-4 3-3-2-6 5"/></svg>' +
      '<span class="cta">写真' + (slot.index + 1) + 'を選ぶ</span>' +
      '<span class="note">カメラロールから選択、またはその場で撮影</span>' +
      '<input type="file" accept="image/*">';
    var fileInput = uploadZone.querySelector('input');
    fileInput.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if (file) loadFile(slot, file);
      fileInput.value = '';
    });

    // -- crop block --
    var cropSection = document.createElement('div');
    cropSection.hidden = true;
    var cropWrap = document.createElement('div');
    cropWrap.className = 'crop-wrap';
    var cropFrame = document.createElement('div');
    cropFrame.className = 'crop-frame';
    var canvas = document.createElement('canvas');
    var ring = document.createElement('div');
    ring.className = 'ring';
    cropFrame.appendChild(canvas);
    cropFrame.appendChild(ring);

    var zoomRow = document.createElement('div');
    zoomRow.className = 'zoom-row';
    var minusBtn = document.createElement('button');
    minusBtn.className = 'icon-btn'; minusBtn.type = 'button'; minusBtn.textContent = '−';
    var zoomSlider = document.createElement('input');
    zoomSlider.type = 'range'; zoomSlider.min = '1'; zoomSlider.max = String(MAX_ZOOM); zoomSlider.step = '0.01'; zoomSlider.value = '1';
    var plusBtn = document.createElement('button');
    plusBtn.className = 'icon-btn'; plusBtn.type = 'button'; plusBtn.textContent = '+';
    zoomRow.appendChild(minusBtn); zoomRow.appendChild(zoomSlider); zoomRow.appendChild(plusBtn);

    var cropHint = document.createElement('p');
    cropHint.className = 'hint';
    cropHint.style.margin = '2px 0 0';
    cropHint.textContent = 'ドラッグで位置合わせ、ピンチまたは +/− で拡大縮小して枠いっぱいに合わせてください。';

    var cropConfirmBtn = document.createElement('button');
    cropConfirmBtn.className = 'btn btn-primary';
    cropConfirmBtn.style.marginTop = '16px';
    cropConfirmBtn.textContent = 'この位置でトリミング確定';

    cropWrap.appendChild(cropFrame);
    cropWrap.appendChild(zoomRow);
    cropWrap.appendChild(cropHint);
    cropSection.appendChild(cropWrap);
    cropSection.appendChild(cropConfirmBtn);

    // -- correction block --
    var correctSection = document.createElement('div');
    correctSection.hidden = true;

    var autoBtn = document.createElement('button');
    autoBtn.type = 'button'; autoBtn.className = 'auto-btn';
    autoBtn.innerHTML = '⚡ 自動補正(くっきり濃く)';
    autoBtn.style.width = '100%'; autoBtn.style.marginBottom = '16px';

    var grid = document.createElement('div');
    grid.className = 'correct-grid';

    var previewWrap = document.createElement('div');
    previewWrap.className = 'correct-preview';
    var previewCanvas = document.createElement('canvas');
    previewCanvas.width = OUT_W; previewCanvas.height = OUT_H;
    previewWrap.appendChild(previewCanvas);

    var controls = document.createElement('div');
    controls.className = 'correct-controls';

    function makeSlider(labelText, min, max, step){
      var field = document.createElement('div'); field.className = 'field';
      var label = document.createElement('label');
      var span = document.createElement('span'); span.textContent = labelText;
      var val = document.createElement('span'); val.className = 'val mono';
      label.appendChild(span); label.appendChild(val);
      var input = document.createElement('input');
      input.type = 'range'; input.min = String(min); input.max = String(max); input.step = String(step);
      field.appendChild(label); field.appendChild(input);
      return { field: field, input: input, valEl: val };
    }
    var brightnessCtl = makeSlider('明るさ', -100, 100, 1);
    var contrastCtl = makeSlider('コントラスト', -100, 100, 1);
    var thresholdCtl = makeSlider('しきい値(2値化)', 0, 255, 1);

    function makeToggle(labelText){
      var row = document.createElement('div'); row.className = 'toggle-row';
      var span = document.createElement('span'); span.textContent = labelText;
      var sw = document.createElement('label'); sw.className = 'switch';
      var input = document.createElement('input'); input.type = 'checkbox';
      var track = document.createElement('span'); track.className = 'track';
      var knob = document.createElement('span'); knob.className = 'knob';
      sw.appendChild(input); sw.appendChild(track); sw.appendChild(knob);
      row.appendChild(span); row.appendChild(sw);
      return { row: row, input: input };
    }
    var grayscaleCtl = makeToggle('グレースケール');
    var binarizeCtl = makeToggle('白黒2値化(最大限濃く)');

    controls.appendChild(grayscaleCtl.row);
    controls.appendChild(brightnessCtl.field);
    controls.appendChild(contrastCtl.field);
    controls.appendChild(binarizeCtl.row);
    controls.appendChild(thresholdCtl.field);
    thresholdCtl.field.hidden = true;

    grid.appendChild(previewWrap);
    grid.appendChild(controls);

    var redoLink = document.createElement('button');
    redoLink.type = 'button'; redoLink.className = 'btn btn-ghost';
    redoLink.textContent = 'トリミングからやり直す';
    redoLink.style.marginTop = '8px';

    var confirmSlotBtn = document.createElement('button');
    confirmSlotBtn.className = 'btn btn-primary';
    confirmSlotBtn.style.marginTop = '10px';

    var finishNowBtn = document.createElement('button');
    finishNowBtn.type = 'button'; finishNowBtn.className = 'btn btn-ghost';
    finishNowBtn.style.marginTop = '4px';

    correctSection.appendChild(autoBtn);
    correctSection.appendChild(grid);
    correctSection.appendChild(confirmSlotBtn);
    correctSection.appendChild(finishNowBtn);
    correctSection.appendChild(redoLink);

    var heading = document.createElement('h2');
    var hint = document.createElement('p'); hint.className = 'hint';

    panel.appendChild(heading);
    panel.appendChild(hint);
    panel.appendChild(uploadZone);
    panel.appendChild(cropSection);
    panel.appendChild(correctSection);
    editorEl.appendChild(panel);

    slot.el = {
      panel: panel, heading: heading, hint: hint,
      uploadZone: uploadZone,
      cropSection: cropSection, canvas: canvas, cropFrame: cropFrame,
      zoomSlider: zoomSlider, minusBtn: minusBtn, plusBtn: plusBtn, cropConfirmBtn: cropConfirmBtn,
      correctSection: correctSection, autoBtn: autoBtn, previewCanvas: previewCanvas,
      brightnessCtl: brightnessCtl, contrastCtl: contrastCtl, thresholdCtl: thresholdCtl,
      grayscaleCtl: grayscaleCtl, binarizeCtl: binarizeCtl,
      confirmSlotBtn: confirmSlotBtn, finishNowBtn: finishNowBtn, redoLink: redoLink
    };

    // ---- wire events ----
    minusBtn.addEventListener('click', function(){ setZoom(slot, slot.transform.scale / 1.2); });
    plusBtn.addEventListener('click', function(){ setZoom(slot, slot.transform.scale * 1.2); });
    zoomSlider.addEventListener('input', function(){ setZoom(slot, parseFloat(zoomSlider.value)); });

    canvas.addEventListener('pointerdown', function(e){
      canvas.setPointerCapture(e.pointerId);
      var r = canvas.getBoundingClientRect();
      slot.pointers.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top });
    });
    canvas.addEventListener('pointermove', function(e){
      if (!slot.pointers.has(e.pointerId)) return;
      var r = canvas.getBoundingClientRect();
      var nx = e.clientX - r.left, ny = e.clientY - r.top;
      if (slot.pointers.size === 1) {
        var prev = slot.pointers.get(e.pointerId);
        slot.transform.panX += nx - prev.x;
        slot.transform.panY += ny - prev.y;
        slot.pointers.set(e.pointerId, { x: nx, y: ny });
        clampPan(slot);
        drawCrop(slot);
      } else if (slot.pointers.size === 2) {
        slot.pointers.set(e.pointerId, { x: nx, y: ny });
        var pts = Array.from(slot.pointers.values());
        var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (slot.pinchStartDist == null) {
          slot.pinchStartDist = dist;
          slot.pinchStartScale = slot.transform.scale;
        } else {
          var ratio = dist / slot.pinchStartDist;
          setZoom(slot, slot.pinchStartScale * ratio, true);
        }
      }
    });
    function endPointer(e){
      slot.pointers.delete(e.pointerId);
      if (slot.pointers.size < 2) { slot.pinchStartDist = null; slot.pinchStartScale = null; }
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('wheel', function(e){
      e.preventDefault();
      setZoom(slot, slot.transform.scale * (e.deltaY < 0 ? 1.1 : 0.9));
    }, { passive: false });

    cropConfirmBtn.addEventListener('click', function(){ confirmCrop(slot); render(); });
    redoLink.addEventListener('click', function(){ slot.stage = 'crop'; render(); });

    [brightnessCtl, contrastCtl, thresholdCtl].forEach(function(ctl){
      ctl.input.addEventListener('input', function(){ readCorrectionUI(slot); applyCorrection(slot); updateCorrectionLabels(slot); });
    });
    grayscaleCtl.input.addEventListener('change', function(){ readCorrectionUI(slot); applyCorrection(slot); render(); });
    binarizeCtl.input.addEventListener('change', function(){ readCorrectionUI(slot); applyCorrection(slot); render(); });
    autoBtn.addEventListener('click', function(){ autoLevels(slot); });
    confirmSlotBtn.addEventListener('click', function(){
      slot.confirmed = true;
      if (currentSlot < 2) { currentSlot += 1; }
      else { view = 'layout'; }
      render();
    });
    finishNowBtn.addEventListener('click', function(){
      slot.confirmed = true;
      view = 'layout';
      render();
    });
  }

  slots.forEach(buildSlotPanel);

  // ============ file loading ============
  function loadFile(slot, file){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      slot.img = img;
      slot.stage = 'crop';
      slot.transform = { scale: 1, panX: 0, panY: 0 };
      render();
    };
    img.src = url;
  }

  // ============ crop canvas ============
  function initCropGeometry(slot){
    var maxW = Math.min(300, window.innerWidth - 72);
    slot.cssW = maxW;
    slot.cssH = maxW / FRAME_RATIO;
    var dpr = window.devicePixelRatio || 1;
    var c = slot.el.canvas;
    c.style.width = slot.cssW + 'px';
    c.style.height = slot.cssH + 'px';
    c.width = Math.round(slot.cssW * dpr);
    c.height = Math.round(slot.cssH * dpr);
    slot.ctx = c.getContext('2d');
    slot.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    slot.baseScale = Math.max(slot.cssW / slot.img.naturalWidth, slot.cssH / slot.img.naturalHeight);
  }

  function clampPan(slot){
    var scale = slot.baseScale * slot.transform.scale;
    var dw = slot.img.naturalWidth * scale, dh = slot.img.naturalHeight * scale;
    var dxCentered = (slot.cssW - dw) / 2, dyCentered = (slot.cssH - dh) / 2;
    var dx = clamp(dxCentered + slot.transform.panX, Math.min(0, slot.cssW - dw), 0);
    var dy = clamp(dyCentered + slot.transform.panY, Math.min(0, slot.cssH - dh), 0);
    slot.transform.panX = dx - dxCentered;
    slot.transform.panY = dy - dyCentered;
  }

  function setZoom(slot, newScale, skipSliderSync){
    slot.transform.scale = clamp(newScale, 1, MAX_ZOOM);
    clampPan(slot);
    drawCrop(slot);
    if (!skipSliderSync) slot.el.zoomSlider.value = String(slot.transform.scale);
  }

  function drawCrop(slot){
    var ctx = slot.ctx;
    ctx.clearRect(0, 0, slot.cssW, slot.cssH);
    var scale = slot.baseScale * slot.transform.scale;
    var dw = slot.img.naturalWidth * scale, dh = slot.img.naturalHeight * scale;
    var dx = (slot.cssW - dw) / 2 + slot.transform.panX;
    var dy = (slot.cssH - dh) / 2 + slot.transform.panY;
    ctx.drawImage(slot.img, dx, dy, dw, dh);
  }

  function confirmCrop(slot){
    var scale = slot.baseScale * slot.transform.scale;
    var dw = slot.img.naturalWidth * scale, dh = slot.img.naturalHeight * scale;
    var dx = (slot.cssW - dw) / 2 + slot.transform.panX;
    var dy = (slot.cssH - dh) / 2 + slot.transform.panY;
    var sx = -dx / scale, sy = -dy / scale, sw = slot.cssW / scale, sh = slot.cssH / scale;

    var off = document.createElement('canvas');
    off.width = OUT_W; off.height = OUT_H;
    var octx = off.getContext('2d');
    octx.drawImage(slot.img, sx, sy, sw, sh, 0, 0, OUT_W, OUT_H);
    slot.rawCropped = octx.getImageData(0, 0, OUT_W, OUT_H);

    if (!slot.finalCanvas) {
      slot.finalCanvas = document.createElement('canvas');
      slot.finalCanvas.width = OUT_W; slot.finalCanvas.height = OUT_H;
    }
    slot.stage = 'correct';
    applyCorrection(slot);
  }

  // ============ correction ============
  function readCorrectionUI(slot){
    var el = slot.el, c = slot.correction;
    c.brightness = parseFloat(el.brightnessCtl.input.value);
    c.contrast = parseFloat(el.contrastCtl.input.value);
    c.threshold = parseFloat(el.thresholdCtl.input.value);
    c.grayscale = el.grayscaleCtl.input.checked;
    c.binarize = el.binarizeCtl.input.checked;
    if (c.binarize && !c.grayscale) { c.grayscale = true; el.grayscaleCtl.input.checked = true; }
    el.thresholdCtl.field.hidden = !c.binarize;
  }

  function updateCorrectionLabels(slot){
    var el = slot.el, c = slot.correction;
    el.brightnessCtl.valEl.textContent = c.brightness;
    el.contrastCtl.valEl.textContent = c.contrast;
    el.thresholdCtl.valEl.textContent = c.threshold;
  }

  function syncCorrectionUI(slot){
    var el = slot.el, c = slot.correction;
    el.brightnessCtl.input.value = c.brightness;
    el.contrastCtl.input.value = c.contrast;
    el.thresholdCtl.input.value = c.threshold;
    el.grayscaleCtl.input.checked = c.grayscale;
    el.binarizeCtl.input.checked = c.binarize;
    el.thresholdCtl.field.hidden = !c.binarize;
    updateCorrectionLabels(slot);
  }

  function applyCorrection(slot){
    var src = slot.rawCropped;
    if (!src) return;
    var c = slot.correction;
    var out = new ImageData(new Uint8ClampedArray(src.data), src.width, src.height);
    var d = out.data;
    var cf = (259 * (c.contrast + 255)) / (255 * (259 - c.contrast));
    var range = Math.max(1, c.levelMax - c.levelMin);
    for (var i = 0; i < d.length; i += 4) {
      if (c.grayscale) {
        var v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        v = (v - c.levelMin) * 255 / range;
        v = cf * (v - 128) + 128 + c.brightness;
        v = v < 0 ? 0 : (v > 255 ? 255 : v);
        if (c.binarize) v = v < c.threshold ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v;
      } else {
        for (var k = 0; k < 3; k++) {
          var vv = cf * (d[i + k] - 128) + 128 + c.brightness;
          d[i + k] = vv < 0 ? 0 : (vv > 255 ? 255 : vv);
        }
      }
    }
    slot.finalCanvas.getContext('2d').putImageData(out, 0, 0);
    if (slot.el.previewCanvas) slot.el.previewCanvas.getContext('2d').putImageData(out, 0, 0);
  }

  function autoLevels(slot){
    var src = slot.rawCropped;
    var d = src.data;
    var hist = new Array(256).fill(0);
    var n = 0;
    for (var i = 0; i < d.length; i += 4) {
      var v = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
      hist[v]++; n++;
    }
    var cut = n * 0.005;
    var cum = 0, min = 0, max = 255;
    for (var lo = 0; lo < 256; lo++) { cum += hist[lo]; if (cum >= cut) { min = lo; break; } }
    cum = 0;
    for (var hi = 255; hi >= 0; hi--) { cum += hist[hi]; if (cum >= cut) { max = hi; break; } }
    if (max <= min) { min = 0; max = 255; }
    slot.correction.levelMin = min;
    slot.correction.levelMax = max;
    slot.correction.brightness = 0;
    slot.correction.contrast = 0;
    slot.correction.grayscale = true;
    syncCorrectionUI(slot);
    applyCorrection(slot);
  }

  // ============ layout: compose the whole A4 sheet into ONE image ============
  // The page runs inside an iframe on claude.ai, so the browser's own print command
  // prints the host page, not this document. A single A4-proportioned image sidesteps
  // that: iOS can print it straight from the image's long-press menu.
  var sheetImgEl = document.getElementById('sheetImg');
  var printSheetImgEl = document.getElementById('printSheetImg');

  function buildLayout(){
    var sheet = document.createElement('canvas');
    sheet.width = SHEET_W; sheet.height = SHEET_H;
    var sctx = sheet.getContext('2d');
    sctx.fillStyle = '#fff';
    sctx.fillRect(0, 0, SHEET_W, SHEET_H);
    var usedCount = 0;
    slots.forEach(function(slot, i){
      if (!slot.finalCanvas) return;
      sctx.drawImage(slot.finalCanvas, CELL_POS[i].x, CELL_POS[i].y, OUT_W, OUT_H);
      usedCount += 1;
    });
    var url = sheet.toDataURL('image/jpeg', 0.95);
    sheetImgEl.src = url;
    printSheetImgEl.src = url;
    var blankCount = 4 - usedCount;
    document.getElementById('layoutHint').textContent = blankCount > 0
      ? 'この画像がそのままA4 1枚になります。空欄が' + blankCount + 'マス残ります。'
      : 'この画像がそのままA4 1枚になります。';
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function(btn){
    btn.addEventListener('click', function(){
      view = 'edit';
      currentSlot = parseInt(btn.getAttribute('data-edit'), 10);
      render();
    });
  });
  document.getElementById('resetAllBtn').addEventListener('click', function(){
    if (!confirm('3枚とも最初からやり直します。よろしいですか?')) return;
    slots.forEach(function(slot){
      slot.img = null; slot.stage = 'upload'; slot.confirmed = false;
      slot.rawCropped = null; slot.finalCanvas = null;
      slot.transform = { scale: 1, panX: 0, panY: 0 };
      slot.correction = { grayscale: true, levelMin: 0, levelMax: 255, brightness: 0, contrast: 0, binarize: false, threshold: 150 };
    });
    currentSlot = 0; view = 'edit';
    render();
  });

  // ============ master render ============
  function render(){
    // step chips
    chipEls.forEach(function(chip, i){
      chip.classList.remove('is-active', 'is-done', 'is-clickable');
      if (i < 3) {
        if (slots[i].confirmed) chip.classList.add('is-done');
        if (slots[i].img) chip.classList.add('is-clickable');
        if (view === 'edit' && currentSlot === i) chip.classList.add('is-active');
      } else {
        if (slots.some(function(s){ return s.confirmed; })) chip.classList.add('is-clickable');
        if (view === 'layout') chip.classList.add('is-active');
      }
    });

    document.getElementById('layoutPanel').hidden = (view !== 'layout');
    editorEl.hidden = (view !== 'edit');

    if (view === 'layout') {
      buildLayout();
      return;
    }

    slots.forEach(function(slot, i){
      var visible = (i === currentSlot);
      slot.el.panel.hidden = !visible;
      if (!visible) return;

      slot.el.heading.textContent = (i + 1) + '枚目';

      if (slot.stage === 'upload' || !slot.img) {
        slot.el.hint.textContent = '感熱紙のレシートなどでも構いません。書類全体が写るように撮影してください。';
        slot.el.uploadZone.hidden = false;
        slot.el.cropSection.hidden = true;
        slot.el.correctSection.hidden = true;
      } else if (slot.stage === 'crop') {
        slot.el.hint.textContent = 'この面は1面あたり ' + CELL_W_MM + '×' + CELL_H_MM + 'mm(A4を4分割)で印刷されます。書類が枠いっぱいに収まるよう合わせてください。';
        slot.el.uploadZone.hidden = true;
        slot.el.cropSection.hidden = false;
        slot.el.correctSection.hidden = true;
        initCropGeometry(slot);
        slot.transform = { scale: 1, panX: 0, panY: 0 };
        slot.el.zoomSlider.value = '1';
        clampPan(slot);
        drawCrop(slot);
      } else if (slot.stage === 'correct') {
        slot.el.hint.textContent = '薄い印字は「自動補正」でくっきりさせてから、必要ならスライダーで微調整してください。';
        slot.el.uploadZone.hidden = true;
        slot.el.cropSection.hidden = true;
        slot.el.correctSection.hidden = false;
        slot.el.confirmSlotBtn.textContent = (i < 2) ? 'この内容で確定して次へ' : 'この内容で確定して仕上げる';
        slot.el.finishNowBtn.hidden = (i >= 2);
        slot.el.finishNowBtn.textContent = 'これだけで仕上げる(残り' + (2 - i) + '枚は空欄のまま印刷)';
        syncCorrectionUI(slot);
      }
    });
  }

  render();
})();
</script>

</body>
</html>
